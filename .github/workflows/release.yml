name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Install desktop dependencies
        run: npm install
        working-directory: desktop

      - name: Build (frontend + backend)
        run: npm run build

      - name: Package (NSIS installer + portable)
        run: npm run app:dist
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'

      # GitHub Release 资产名对非 ASCII 不友好（中文会被剥成 "AI."），统一改 ASCII 规范名
      - name: Rename artifacts to ASCII
        run: |
          $v = (Get-Content desktop/package.json | ConvertFrom-Json).version
          Get-ChildItem desktop/release/*.exe | ForEach-Object {
            $kind = if ($_.Name -like '*portable*') { 'portable' } else { 'setup' }
            Rename-Item $_.FullName "werewolf-research-$v-$kind.exe"
          }

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
